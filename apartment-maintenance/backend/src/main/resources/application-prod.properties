# ============================================================
# PROD PROFILE = AWS (Elastic Beanstalk + RDS MySQL + S3)
# Run with:  java -jar application.jar --spring.profiles.active=prod
# or set env var:  SPRING_PROFILES_ACTIVE=prod
# ============================================================

# Elastic Beanstalk (Java SE platform) forwards traffic to port 5000
server.port=5000

# ---- AWS RDS MySQL ----
# Set these as environment properties in the Elastic Beanstalk console,
# NEVER hard-code your password in Git.
spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT:3306}/${RDS_DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Store and serve all timestamps in UTC. The API emits ISO-8601 with a 'Z',
# so the browser converts to the viewer's local time by itself.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.h2.console.enabled=false

# ---- AWS S3 ----
aws.s3.enabled=true
aws.s3.bucket=${S3_BUCKET}
aws.s3.region=${AWS_REGION:us-east-1}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
