# ============================================================
# DEFAULT PROFILE = LOCAL DEVELOPMENT
# H2 in-memory DB, no MySQL needed. Just run and it works.
# ============================================================

spring.application.name=maintenance-api
server.port=8080

# ---- Database (H2 in memory) ----
spring.datasource.url=jdbc:h2:mem:maintenancedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Store and serve all timestamps in UTC. The API emits ISO-8601 with a 'Z',
# so the browser converts to the viewer's local time by itself.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Browse the DB at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:maintenancedb)
spring.h2.console.enabled=true

# ---- Photo upload ----
# false = save photos into the local ./uploads folder
# true  = upload to S3 (see application-prod.properties)
aws.s3.enabled=false
app.upload-dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
